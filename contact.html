
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Petal & Co.</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <nav class="navbar bg-1 fg-2 md:navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Petal & Co.</a>

            <button class="btn-icon navbar-toggler" type="button"
                data-bs-toggle="drawer" data-bs-target="#contactMenu"
                aria-controls="contactMenu" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog class="drawer drawer-end" tabindex="-1" id="contactMenu"
                aria-labelledby="contactMenuLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="contactMenuLabel">Menu</h5>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>

                <div class="drawer-body">
                    <ul class="navbar-nav me-auto mb-2">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#collection">Our Collection</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page"
                                href="contact.html">Contact Us</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container mt-5">
        <h1>Get in Touch</h1>
        <p>Have a question or looking for the perfect bouquet? We'd love to hear from you!</p>

        <form>
            <div class="row g-4">

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="firstName">First Name</label>
                        <input type="text" class="form-control"
                            id="firstName" name="firstName">
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="lastName">Last Name</label>
                        <input type="text" class="form-control"
                            id="lastName" name="lastName">
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="email">Email Address</label>
                        <input type="email" class="form-control"
                            id="email" name="email"
                            placeholder="name@example.com">
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label for="inquiry">Inquiry Type</label>
                        <select class="form-control" id="inquiry" name="inquiry">
                            <option value="">Choose an inquiry</option>
                            <option value="custom">Custom Bouquet</option>
                            <option value="order">Existing Order</option>
                            <option value="event">Event Flowers</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-field">
                        <label for="message">Your Message</label>
                        <textarea class="form-control" id="message"
                            name="message" rows="5"></textarea>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-field">
                        <input type="checkbox" class="check"
                            id="consent" name="consent">
                        <label for="consent">
                            I agree to be contacted by Petal & Co. regarding my inquiry.
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn-solid theme-primary">
                        Send Message
                    </button>
                </div>

            </div>
        </form>
    </main>

    <footer class="bg-1 fg-2 mt-5 p-4 text-center">
        <h4>Petal & Co.</h4>
        <p>Flowers for every little moment.</p>
        <p>Bringing beauty and blooms to your special occasions.</p>
        <p>&copy; 2026 Petal & Co. All rights reserved.</p>
    </footer>

</body>
</html>
